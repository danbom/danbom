name: Update latest blog posts

on:
  schedule:
    - cron: "0 0 * * *"   # 매일 09:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull latest posts from Devvvvvv (Tistory RSS)
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://danbom425.tistory.com/rss"
          max_post_count: 5
          user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          accept_header: "*/*"
          date_format: "yyyy.MM.dd"
          template: "- [$title]($url) <sub>$date</sub>$newline"
          commit_message: "docs: update latest blog posts"
