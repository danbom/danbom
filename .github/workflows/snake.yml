name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # 12시간마다 갱신
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFB6C2&color_dots=#E8F5E6,#BDDFCF,#98C3B7,#7FB0A7,#659D96
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFB6C2&color_dots=#161b22,#3C5E59,#659D96,#98C3B7,#BDDFCF

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
